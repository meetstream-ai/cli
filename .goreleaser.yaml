# goreleaser v2: one binary for six targets, plus a Homebrew cask.
# Snapshot builds run locally and in CI; real releases run from a tag.
# Tests run in CI before this, so there are no before-hooks here
# (`go mod tidy` in a hook would dirty the tree mid-release).
version: 2
project_name: meetstream

builds:
  - id: meetstream
    main: ./cmd/meetstream
    binary: meetstream
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "meetstream_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, SKILL.md]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  disable: true

# Pushes to meetstream-ai/homebrew-tap only when HOMEBREW_TAP_TOKEN is set
# (GITHUB_TOKEN cannot write to another repo); otherwise the cask is built
# into dist/ and not uploaded. Prereleases are never uploaded.
homebrew_casks:
  - name: meetstream
    binaries: [meetstream]
    repository:
      owner: meetstream-ai
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    directory: Casks
    homepage: https://meetstream.ai
    description: "MeetStream CLI: meeting bots, transcripts and your own agent in the call"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
